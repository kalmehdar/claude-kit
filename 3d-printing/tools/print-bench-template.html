<meta charset="utf-8">
<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Amiri:wght@700&display=swap">
<style>
/* Layout: a parts list beside one large turntable viewer; on a phone the viewer comes first and the list follows. */
:root{
  --ground:#f3f2ee; --surface:#ffffff; --ink:#18191c; --ink2:#55585f; --ink3:#868991; --hair:#dedcd5;
  --brass:#8f6f22; --brass-soft:#f3ead3; --stage:#d6d4cc; --stage2:#f6f5f1; --bedline:#a9a597; --bedfill:#ecebe6;
  --ok:#2f7a4d; --ok-bg:#e3f1e8; --warn:#8a5a10; --warn-bg:#f8ecd2; --idle:#5f636b; --idle-bg:#ebebe8;
  --sans:Inter,"Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace; --mark:Amiri,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#141517; --surface:#1c1d20; --ink:#eceae4; --ink2:#b3b1aa; --ink3:#86847e; --hair:#2e2f33;
  --brass:#cfa962; --brass-soft:#2c2618; --stage:#4f5157; --stage2:#7d7f86; --bedline:#8d8f95; --bedfill:#57595f;
  --ok:#7fcf9d; --ok-bg:#1c2b22; --warn:#e7b960; --warn-bg:#2d2416; --idle:#a3a5ab; --idle-bg:#26272a;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#141517; --surface:#1c1d20; --ink:#eceae4; --ink2:#b3b1aa; --ink3:#86847e; --hair:#2e2f33;
  --brass:#cfa962; --brass-soft:#2c2618; --stage:#4f5157; --stage2:#7d7f86; --bedline:#8d8f95; --bedfill:#57595f;
  --ok:#7fcf9d; --ok-bg:#1c2b22; --warn:#e7b960; --warn-bg:#2d2416; --idle:#a3a5ab; --idle-bg:#26272a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--hair);padding-bottom:12px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink3);font-size:13px}
.mark{font-family:var(--mark);font-size:34px;line-height:1;color:var(--brass)}
.main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:10px;
  display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 12px;align-items:center;color:inherit;font:inherit;cursor:pointer}
.item .thumb{grid-row:1/3;width:76px;height:76px;border-radius:6px;background:radial-gradient(ellipse at 50% 35%,var(--stage2),var(--stage) 80%);object-fit:cover;display:block}
.item .row{min-width:0}
.item:hover{border-color:var(--ink3)}
.item[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.item:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:2px}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-weight:600;font-size:14.5px}
.dims{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.ready{color:var(--ok);background:var(--ok-bg)} .chip.check{color:var(--warn);background:var(--warn-bg)} .chip.later{color:var(--idle);background:var(--idle-bg)}
.swatches{display:flex;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--hair)}
.stagecol{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.stage{position:relative;background:radial-gradient(ellipse at 50% 35%,var(--stage2),var(--stage) 75%);border:1px solid var(--hair);border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;max-width:100%}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.tools button{font:500 12.5px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:6px 10px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.tools button:disabled{opacity:.4;cursor:default}
.stage.full{position:fixed;inset:0;z-index:50;aspect-ratio:auto;border-radius:0;border:0;max-width:none}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink3)}
.info{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px}
.info h2{grid-column:1/-1;margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.sliced{display:flex;flex-direction:column;gap:2px}
.sliced .warn{color:#b4531f}
.sliced .plate{margin-top:6px;width:100%;max-width:220px;aspect-ratio:1;object-fit:contain;border:1px solid var(--hair);border-radius:8px;background:#fff}
.info .for{grid-column:1/-1;margin:-6px 0 0;color:var(--ink2)}
.kv{display:flex;flex-direction:column;gap:2px}
.k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.v{font-size:14px;color:var(--ink)} .v.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts label{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--hair);border-radius:6px;padding:4px 8px;cursor:pointer}
.parts input{accent-color:var(--brass);margin:0}
.credit{grid-column:1/-1;font-size:12.5px;color:var(--ink3)}
footer{font-size:12.5px;color:var(--ink3)}
/* Phone-first additions: the list and viewer work one-handed */
.updated{font-size:12px;color:var(--ink3);margin-top:4px}
.summary{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.summary .k{margin:0}
.spools{display:flex;flex-wrap:wrap;gap:8px}
.spool{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--hair);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:600 13px var(--sans);color:var(--ink2);background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:8px 12px;min-height:36px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.side{display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.item{padding:14px}.item b{font-size:15px}}
.err{padding:24px;color:var(--ink2)}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.stagecol{position:static;order:-1}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="h1">Print Bench</h1>
      <p class="sub" id="sub"></p>
      <p class="updated">Updated /*BUILT*/</p>
    </div>
    <span class="mark" id="mark"></span>
  </header>

  <div class="main">
    <div class="side">
      <section class="summary" aria-label="Filament to load">
        <span class="k">Filament for everything not marked Later</span>
        <div class="spools" id="spools"></div>
      </section>
      <div class="filters" id="filters" role="group" aria-label="Show"></div>
      <ul class="list" id="list" aria-label="Designs"></ul>
    </div>
    <div class="stagecol">
      <div class="stage" id="stage">
        <div class="tools">
          <button type="button" id="bedBtn" aria-pressed="true">Bed</button>
          <button type="button" id="edgeBtn" aria-pressed="true">Edges</button>
          <button type="button" id="resetBtn">Reset view</button>
          <button type="button" id="fullBtn" aria-pressed="false">Full view</button>
        </div>
        <span class="hint" id="hint">Drag to turn · pinch to zoom</span>
      </div>
      <section class="info" id="info" aria-live="polite"></section>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const MODELS = /*MODELS*/[];
const CONFIG = Object.assign({title: "Print Bench", sub: "", mark: "", markLang: "", foot: "", bed: 270}, /*CONFIG*/{});
document.getElementById("h1").textContent = CONFIG.title;
document.getElementById("sub").textContent = CONFIG.sub;
const markEl = document.getElementById("mark"); markEl.textContent = CONFIG.mark; if (CONFIG.markLang) markEl.lang = CONFIG.markLang; markEl.hidden = !CONFIG.mark;
document.getElementById("foot").innerHTML = CONFIG.foot;
const STATE_LABEL = {ready:"Ready", check:"Check first", later:"Later"};
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = s => s.map(n => n.toFixed(1)).join(" x ") + " mm";
const grams = m => m.parts.every(p => p.grams != null) ? Math.round(m.parts.reduce((t, p) => t + p.grams, 0)) : 0;

// Next up first: Check first, then Ready, then Later; each keeps its own order.
const RANK = {check: 0, ready: 1, later: 2};
const gtxt = g => g < 1 ? "under 1 g" : Math.round(g) + " g";
const hm = s => `${Math.floor(s / 3600)} h ${String(Math.round(s % 3600 / 60)).padStart(2, "0")} min`;
MODELS.sort((a, b) => (RANK[a.state] ?? 3) - (RANK[b.state] ?? 3));
// Filament per spool for everything not marked Later, from each part's colour and the design's material.
const COLOUR = {"#1f1f22": "Black", "#ecebe6": "White", "#c9a24a": "Gold", "#1d2533": "Navy", "#e8ecf3": "Pale", "#8a8f98": "Grey", "#c8102e": "Red", "#002fa7": "Klein blue"};
const need = {};
MODELS.filter(m => m.state !== "later").forEach(m => m.parts.forEach(p => {
  if (p.grams == null) return;
  const key = (COLOUR[p.colour] || p.colour) + " " + (/PLA/.test(m.material) && !/PETG/.test(m.material) ? "PLA" : "PETG");
  need[key] = (need[key] || {g: 0, c: p.colour}); need[key].g += p.grams;
}));
$("#spools").innerHTML = Object.entries(need).sort((a, b) => b[1].g - a[1].g)
  .map(([k, v]) => `<span class="spool"><span class="sw" style="background:${v.c}"></span>${k} <b>${gtxt(v.g)}</b></span>`).join("") || '<span class="v">Nothing queued.</span>';
// Filters
const FILTERS = [["all", "All"], ["check", "Check first"], ["ready", "Ready"], ["later", "Later"]];
let filter = "all";
function applyFilter() {
  document.querySelectorAll("#list li").forEach((li, i) => li.hidden = filter !== "all" && MODELS[i].state !== filter);
  document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}
$("#filters").innerHTML = FILTERS.filter(([f]) => f === "all" || MODELS.some(m => m.state === f)).map(([f, l]) => `<button type="button" data-f="${f}">${l} (${f === "all" ? MODELS.length : MODELS.filter(m => m.state === f).length})</button>`).join("");
$("#filters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { filter = b.dataset.f; applyFilter(); } });
const list = $("#list");
MODELS.forEach((m, i) => {
  const li = document.createElement("li");
  li.innerHTML = `<button type="button" class="item" id="m-${m.id}" aria-pressed="false">
    <img class="thumb" alt="" id="t-${m.id}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span class="row"><b>${m.name}</b><span class="chip ${m.state}">${STATE_LABEL[m.state]}</span></span>
    <span class="row"><span class="dims">${fmt(m.size)}${grams(m) ? ` · ${grams(m)} g` : ""}</span><span class="swatches">${m.parts.map(p => `<span class="sw" style="background:${p.colour}" title="${p.label}"></span>`).join("")}</span></span>
  </button>`;
  li.firstElementChild.addEventListener("click", () => {
    show(i);
    if (matchMedia("(max-width: 820px)").matches) document.querySelector(".stagecol").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  });
  list.appendChild(li);
});
applyFilter();

if (!window.THREE || !THREE.OrbitControls) {
  $("#stage").innerHTML = '<p class="err">The 3D viewer could not load. Check the connection and reload the page.</p>';
} else {
  var stage = $("#stage");
  var renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 4/3, 1, 5000);
  camera.up.set(0, 0, 1);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.7));
  var sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(300, -400, 600); scene.add(sun); scene.add(sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({opacity: 0.22}));
  ground.position.z = -0.1; ground.receiveShadow = true; scene.add(ground);
  var fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(-400, 300, 200); scene.add(fill);
  var rim = new THREE.DirectionalLight(0xdfe6ff, 0.45); rim.position.set(-200, 600, 500); scene.add(rim);   // from behind: dark parts stand off the ground

  var bed = new THREE.Group();
  var bedPlate = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.bed, CONFIG.bed), new THREE.MeshBasicMaterial({transparent: true, opacity: 0.45, toneMapped: false}));
  bedPlate.position.z = -0.2; bed.add(bedPlate);
  var bedEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(CONFIG.bed, CONFIG.bed)), new THREE.LineBasicMaterial());
  bed.add(bedEdge); scene.add(bed);
  var current = null, model = null, needs = true, bedOn = true, edgesOn = true;

  function theme() {
    scene.background = null;   // the stage's own gradient shows through
    bedPlate.material.color.set(css("--bedfill"));
    bedEdge.material.color.set(css("--bedline"));
    needs = true;
  }
  theme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
  new MutationObserver(theme).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

  function decode(b64, q0, qs) {   // 16-bit integers on a per-part step (see build_viewer.py)
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const ints = new Uint16Array(buf.buffer), out = new Float32Array(ints.length);
    for (let i = 0; i < ints.length; i++) out[i] = q0 + ints[i] * qs;
    return out;
  }

  function frame() {
    // Fit the whole model in the stage at any width (18 Nov: the rack was cropped in a narrow pane): the
    // bounding sphere must fit the narrower of the two fields of view.
    const s = current.size, R = Math.max(0.5 * Math.hypot(s[0], s[1], s[2]), 30);
    const vf = camera.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
    const d = R * 1.1 / Math.sin(Math.min(vf, hf) / 2), k = d / Math.hypot(0.55, 1.35, 0.95);
    controls.target.set(0, 0, s[2] / 2);
    camera.position.set(0.55 * k, -1.35 * k, s[2] / 2 + 0.95 * k);
    controls.update(); needs = true;
  }

  function buildModel(m, withEdges) {
    const grp = new THREE.Group();
    m.parts.forEach(p => {
      const g = p._g || (p._g = (() => { const b = new THREE.BufferGeometry();
        b.setAttribute("position", new THREE.BufferAttribute(decode(p.data, p.q0, p.qs), 3)); b.computeVertexNormals(); return b; })());
      const col = new THREE.Color(p.colour).convertSRGBToLinear();
      const mesh = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({color: col, roughness: 0.6, metalness: p.colour === "#c9a24a" ? 0.35 : 0.0,
        clearcoat: 0.08, clearcoatRoughness: 0.6, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1}));
      mesh.castShadow = true; mesh.receiveShadow = true; mesh.name = p.label; grp.add(mesh);
      if (withEdges) {
        // Edge lines: creases sharper than 28 degrees, so holes, slots and chamfers read on black prints
        const c = new THREE.Color(p.colour), lum = 0.3 * c.r + 0.59 * c.g + 0.11 * c.b;
        const edges = new THREE.LineSegments(p._e || (p._e = new THREE.EdgesGeometry(g, 28)),
          new THREE.LineBasicMaterial({color: lum < 0.12 ? new THREE.Color(0x8e949e) : c.clone().multiplyScalar(lum < 0.5 ? 0.55 : 0.7),
            transparent: true, opacity: lum < 0.12 ? 0.5 : 0.8}));   // grey on black parts, a deeper shade of the part's own colour on the rest
        edges.visible = edgesOn; edges.userData.edge = true; grp.add(edges);
      }
    });
    return grp;
  }
  function aimSun(s) {   // shadow box sized to the model, so every print gets a crisp contact shadow
    const r = Math.max(s[0], s[1], s[2], 60) * 0.9, c = sun.shadow.camera;
    c.left = -r; c.right = r; c.top = r; c.bottom = -r; c.near = 1; c.far = 4000; c.updateProjectionMatrix();
    sun.position.set(r * 0.9, -r * 1.2, r * 2 + s[2]); sun.target.position.set(0, 0, 0);
  }

  window.show = function (i) {
    current = MODELS[i];
    document.querySelectorAll(".item").forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
    if (model) { scene.remove(model); model.traverse(o => { if (o.material) o.material.dispose(); }); }
    model = buildModel(current, true);
    scene.add(model); aimSun(current.size);
    $("#info").innerHTML = `<h2>${current.name}</h2><p class="for">${current.for}</p>
      <div class="kv"><span class="k">Size</span><span class="v mono">${fmt(current.size)}</span></div>
      ${grams(current) ? `<div class="kv"><span class="k">Filament, estimate</span><span class="v mono">about ${grams(current)} g: ${current.parts.map(p => `${p.label} ${gtxt(p.grams)}`).join(", ")}</span></div>` : ""}
      ${(current.sliced || []).map(s => `<div class="kv sliced"><span class="k">Sliced in Orca${current.sliced.length > 1 ? `: ${s.name}` : ""}</span>
        <span class="v mono">${hm(s.secs)}${s.qty > 1 ? ` each, ${s.qty} to print` : ""} · ${s.grams.map((g, k) => `${Math.round(g)} g ${s.colours[k] || (k ? "white" : "black")}`).join(", ")}${s.cost != null ? ` · £${s.cost.toFixed(2)} of filament${s.qty > 1 ? " each" : ""}` : ""}</span>
        <span class="v ${s.face_down ? "" : "warn"}">${s.face_down ? "Visible face is down on the plate" : "Check the orientation in Orca before printing"}</span>
        ${s.png ? `<img class="plate" src="data:image/png;base64,${s.png}" alt="Orca's plate preview of ${s.name}" loading="lazy">` : ""}</div>`).join("")}
      <div class="kv"><span class="k">Status</span><span class="v">${current.status}</span></div>
      <div class="kv"><span class="k">Material and heads</span><span class="v">${current.material}</span></div>
      <div class="kv"><span class="k">Parts, one head each</span><span class="parts">${current.parts.map((p, k) =>
        `<label><input type="checkbox" id="part-${current.id}-${k}" checked data-k="${k}"><span class="sw" style="background:${p.colour}"></span>${p.label}</label>`).join("")}</span></div>
      <p class="credit">${current.credit}</p>`;
    $("#info").querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
      const k = +cb.dataset.k; model.children.filter(o => o.isMesh)[k].visible = cb.checked; const e = model.children.filter(o => o.userData.edge)[k]; if (e) e.visible = cb.checked && edgesOn; needs = true;
    }));
    bed.visible = bedOn && !current.nobed;
    $("#bedBtn").disabled = !!current.nobed;
    frame();
    if (location.hash !== "#" + current.id) history.replaceState(null, "", "#" + current.id);
  };

  $("#resetBtn").addEventListener("click", () => current && frame());
  $("#edgeBtn").addEventListener("click", e => {
    edgesOn = !edgesOn; e.currentTarget.setAttribute("aria-pressed", String(edgesOn));
    if (model) model.traverse(o => { if (o.userData.edge) o.visible = edgesOn; }); needs = true;
  });
  function setFull(on) {
    stage.classList.toggle("full", on); $("#fullBtn").setAttribute("aria-pressed", String(on));
    $("#fullBtn").textContent = on ? "Close" : "Full view"; resize(); frame();
  }
  $("#fullBtn").addEventListener("click", () => setFull(!stage.classList.contains("full")));
  addEventListener("keydown", e => { if (e.key === "Escape" && stage.classList.contains("full")) setFull(false); });
  $("#bedBtn").addEventListener("click", e => {
    bedOn = !bedOn; bed.visible = bedOn && !current.nobed; e.currentTarget.setAttribute("aria-pressed", String(bedOn)); needs = true;
  });
  controls.addEventListener("change", () => { needs = true; $("#hint").hidden = true; });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); needs = true;
  }
  new ResizeObserver(resize).observe(stage);
  (function loop() { requestAnimationFrame(loop); if (controls.update() || needs) { renderer.render(scene, camera); needs = false; } })();

  const start = MODELS.findIndex(m => "#" + m.id === location.hash);
  show(start >= 0 ? start : 0);

  // List pictures: each design rendered once in its print colours; its geometry is kept for when it is opened.
  const tr = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
  tr.setPixelRatio(1); tr.setSize(152, 152); tr.outputEncoding = THREE.sRGBEncoding;
  tr.toneMapping = THREE.ACESFilmicToneMapping; tr.toneMappingExposure = 1.0; tr.shadowMap.enabled = true;
  const tcam = new THREE.PerspectiveCamera(30, 1, 1, 5000); tcam.up.set(0, 0, 1);
  let ti = 0;
  (function thumbNext() {
    if (ti >= MODELS.length) { tr.dispose(); return; }
    const m = MODELS[ti++], img = document.getElementById("t-" + m.id);
    const grp = buildModel(m, false); scene.add(grp); aimSun(m.size);
    const was = model ? model.visible : false, bedWas = bed.visible; if (model) model.visible = false; bed.visible = false;
    const s = m.size, R = Math.max(0.5 * Math.hypot(s[0], s[1], s[2]), 20), d = R * 1.05 / Math.sin(tcam.fov * Math.PI / 360);
    const k = d / Math.hypot(0.55, 1.35, 0.95);
    tcam.position.set(0.55 * k, -1.35 * k, s[2] / 2 + 0.95 * k); tcam.lookAt(0, 0, s[2] / 2);
    tr.render(scene, tcam); img.src = tr.domElement.toDataURL("image/png"); img.alt = m.name;
    scene.remove(grp); grp.traverse(o => { if (o.material) o.material.dispose(); });
    if (model) model.visible = was; bed.visible = bedWas; aimSun(current.size); needs = true;
    setTimeout(thumbNext, 30);
  })();
}
</script>
